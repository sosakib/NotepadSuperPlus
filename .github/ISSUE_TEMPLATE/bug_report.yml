name: "🐛 Bug report"
description: Report a defect in Notepad Super Plus
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues first. For security
        vulnerabilities, do **not** file here — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: App version
      description: Help → About, or the release tag. Include "built from source @ <commit>" if applicable.
      placeholder: v0.x.y
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Windows-first project; other OSes are not yet supported.
      options:
        - Windows 11
        - Windows 10
        - Other (unsupported — note in description)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Type ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sample document / file (if relevant)
      description: Minimal Markdown that triggers the issue. Paste inline or attach.
  - type: textarea
    id: extra
    attributes:
      label: Logs, screenshots, or extra context
