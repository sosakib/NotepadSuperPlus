name: CodeQL

# Static analysis for the JS/TS and Rust code. Guarded by source paths so it only runs
# once code exists; the weekly schedule is enabled in Stage 11 (Security Hardening).
# See docs/ROADMAP.md and docs/08_Security_Model.md §6.

on:
  workflow_dispatch:
  # Automatic runs are disabled for now: uploading CodeQL results (SARIF) to code
  # scanning requires a PUBLIC repository or GitHub Advanced Security. On the current
  # private/free plan the "Perform CodeQL Analysis" upload step fails with
  # "Resource not accessible by integration". Re-enable these triggers once the repo
  # is public or GHAS is available (planned: Stage 11 — docs/08 §6).
  # push:
  #   branches: [main, develop]
  #   paths: ["src/**", "src-tauri/**"]
  # pull_request:
  #   branches: [main, develop]
  #   paths: ["src/**", "src-tauri/**"]
  # schedule:
  #   - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
        # "rust" added in Stage 1 once src-tauri exists.
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
