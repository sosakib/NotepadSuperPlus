name: CodeQL

# Static analysis for the JS/TS and Rust code. Guarded by source paths so it only runs
# once code exists; the weekly schedule is enabled in Stage 11 (Security Hardening).
# See ROADMAP.md and docs/08_Security_Model.md §6.

on:
  push:
    branches: [main, develop]
    paths: ["src/**", "src-tauri/**"]
  pull_request:
    branches: [main, develop]
    paths: ["src/**", "src-tauri/**"]
  workflow_dispatch:
  # schedule:
  #   - cron: "0 3 * * 1"   # enabled in Stage 11

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
        # "rust" added in Stage 1 once src-tauri exists.
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          language: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
