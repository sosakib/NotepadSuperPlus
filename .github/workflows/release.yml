name: Release

# Builds the Windows installers (NSIS + MSI) on a version tag, generates
# SHA-256 checksums, and publishes a draft GitHub Release for manual review.
# Code signing is intentionally absent until a certificate exists — see
# docs/18_Release_Checklist.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm tauri build

      - name: Collect artifacts & checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.exe, *.msi |
            Copy-Item -Destination release-artifacts
          $lines = Get-ChildItem release-artifacts | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          $lines | Out-File -Encoding utf8 release-artifacts/SHA256SUMS.txt
          Get-Content release-artifacts/SHA256SUMS.txt

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-artifacts/*
