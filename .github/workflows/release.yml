name: Release

# Builds the Windows installers (NSIS + MSI) on a version tag, generates
# SHA-256 checksums, and publishes a draft GitHub Release for manual review.
# Code signing is intentionally absent until a certificate exists — see
# docs/18_Release_Checklist.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm tauri build

      # Reported, not gated. The original < 500 ms budget is unreachable for a WebView2
      # app -- ~1 s elapses in Tauri/WebView2 window creation before any of our code runs
      # (docs/reports/STARTUP_PERFORMANCE.md). Add -FailOver once a budget is agreed.
      - name: Startup benchmark (reported)
        shell: pwsh
        continue-on-error: true
        run: ./scripts/bench/startup.ps1 -Runs 7

      # Same script contributors run locally, so CI and a local release cannot drift.
      - name: Package release bundle
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 -SkipBuild
          Get-Content release/checksums/SHA256SUMS.txt

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: docs/RELEASE_NOTES.md
          files: |
            release/installer/*
            release/checksums/SHA256SUMS.txt
