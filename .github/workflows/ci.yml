name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · typecheck · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Formatting was enforced locally but never in CI, so a drifted file could merge.
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 3

  core:
    name: Rust core (fmt · clippy · test · build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Build frontend (generate ../dist for tauri context)
        run: pnpm build
      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path src-tauri/Cargo.toml --all
      - name: build (debug)
        run: cargo build --manifest-path src-tauri/Cargo.toml
